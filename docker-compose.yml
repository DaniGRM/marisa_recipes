services:
  app:
    image: arm32v7/php:8.2-fpm
    container_name: marisa_app
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      - db

  db:
    image: arm32v7/mariadb:10.6
    container_name: marisa_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: marisa
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  adminer:
    image: adminer
    container_name: marisa_adminer
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  db_data: